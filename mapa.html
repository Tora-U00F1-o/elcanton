<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ruta Guided Web - Mapa</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  
  <!-- Global Stylesheet -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <h1 class="app-title" id="appHeaderTitle">
        <svg class="header-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
        </svg>
        CA El Cantón Tornin
      </h1>
      <!-- Back button to return to dashboard -->
      <a href="index.html" style="text-decoration: none;" id="btnHeaderBack" title="Volver al Dashboard">
        <svg class="header-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
        </svg>
      </a>
    </header>

    <!-- Map View Container -->
    <div class="map-view-container">
      <!-- Floating Top Right Controls Stack -->
      <div class="map-top-controls">
        <button class="map-btn-top" id="btnOpenGoogleMaps">
          <svg class="btn-icon maps-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
          </svg>
          Abrir en Google Maps
        </button>
        <button class="map-btn-top" id="btnRecenterGPS">
          <svg class="btn-icon gps-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <circle cx="12" cy="12" r="3"/>
            <line x1="12" y1="1" x2="12" y2="4"/>
            <line x1="12" y1="20" x2="12" y2="23"/>
            <line x1="1" y1="12" x2="4" y2="12"/>
            <line x1="20" y1="12" x2="23" y2="12"/>
          </svg>
          Centrar GPS
        </button>
      </div>

      <!-- Leaflet Map -->
      <div id="map"></div>

      <!-- Floating Tip Banner -->
      <div class="map-tip-banner" id="mapTipBanner">
        <span class="tip-icon">💡</span>
        <span class="tip-text">Pulsa sobre los puntos de interés para obtener indicaciones de la ruta.</span>
        <button class="tip-close-btn" id="btnCloseTip" aria-label="Cerrar tip">&times;</button>
      </div>

      <!-- Floating HUD Card (Punto de control checkpoint details) -->
      <div class="checkpoint-popup-hud" id="checkpointHUD">
        <button class="hud-close-btn" id="btnCloseHUD" aria-label="Cerrar">&times;</button>
        <div class="hud-img-container">
          <img src="" alt="Punto de control" class="hud-image" id="hudImg">
        </div>
        <div class="hud-text-container">
          <h4 class="hud-title" id="hudTitle">Punto de Control</h4>
          <p class="hud-desc" id="hudDesc">Descripción de la parada</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <!-- App Scripts -->
  <script src="js/config.js"></script>
  <script src="js/admin-config.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
